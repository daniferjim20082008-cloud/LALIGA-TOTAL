name: Actualizar y publicar LALIGA TOTAL

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "live-data.json"
      - ".nojekyll"
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: "laliga-total-pages"
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout LALIGA TOTAL
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Actualizar datos · proveedor principal
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_laliga_total.py

      - name: Completar datos con respaldo ESPN
        continue-on-error: true
        run: python scripts/update_laliga_espn.py

      - name: Guardar actualización y publicar en gh-pages
        shell: bash
        run: |
          touch .nojekyll
          git config user.name "LALIGA TOTAL Bot"
          git config user.email "actions@users.noreply.github.com"
          git add live-data.json .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar datos de LALIGA TOTAL"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          else
            git fetch origin main
            git reset --hard origin/main
          fi
          git push origin HEAD:gh-pages --force
