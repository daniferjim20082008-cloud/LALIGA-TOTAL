name: Actualizar y publicar LALIGA TOTAL

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "live-data.json"
      - "broadcast-data.json"
      - "official-match-data.json"
      - ".nojekyll"
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: "laliga-total-pages"
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout LALIGA TOTAL
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Actualizar datos · proveedor principal
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_laliga_total.py

      - name: Completar datos con respaldo ESPN
        continue-on-error: true
        run: python scripts/update_laliga_espn.py

      - name: Actualizar postpartidos desde LALIGA oficial
        continue-on-error: true
        run: python scripts/update_official_match_details.py

      - name: Actualizar operadores oficiales de TV
        continue-on-error: true
        run: python scripts/update_broadcasts.py

      - name: Guardar actualización y publicar en gh-pages
        shell: bash
        run: |
          cp live-data.json /tmp/laliga-live-data.json
          cp broadcast-data.json /tmp/laliga-broadcast-data.json
          cp official-match-data.json /tmp/laliga-official-match-data.json
          git config user.name "LALIGA TOTAL Bot"
          git config user.email "actions@users.noreply.github.com"

          pushed=0
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/laliga-live-data.json live-data.json
            cp /tmp/laliga-broadcast-data.json broadcast-data.json
            cp /tmp/laliga-official-match-data.json official-match-data.json
            touch .nojekyll
            git add live-data.json broadcast-data.json official-match-data.json .nojekyll
            if ! git diff --cached --quiet; then
              git commit -m "Actualizar datos de LALIGA TOTAL"
              if git push origin HEAD:main; then
                pushed=1
                break
              fi
              echo "Cambio concurrente detectado; reintentando ($attempt/3)…"
              sleep 2
            else
              pushed=1
              break
            fi
          done

          if [ "$pushed" -ne 1 ]; then
            echo "No se pudo guardar la actualización tras 3 intentos"
            exit 1
          fi

          git fetch origin main
          git reset --hard origin/main
          git push origin HEAD:gh-pages --force
