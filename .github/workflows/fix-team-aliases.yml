name: Corregir identificación de clubes

on:
  push:
    paths:
      - ".github/workflows/fix-team-aliases.yml"
      - "scripts/fix_team_aliases.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar corrección de aliases
        run: python scripts/fix_team_aliases.py

      - name: Guardar corrección
        shell: bash
        run: |
          git config user.name "LALIGA TOTAL Bot"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/fix-team-aliases.yml
          git add match-center.js client-rosters.js match-sofa-fallback.js scripts/update_laliga_espn.py scripts/update_laliga_total.py .github/workflows/fix-team-aliases.yml
          git commit -m "Priorizar nombres específicos al identificar clubes"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
