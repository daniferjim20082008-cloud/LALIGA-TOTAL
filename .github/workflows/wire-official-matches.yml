name: Conectar postpartidos oficiales

on:
  push:
    paths:
      - ".github/workflows/wire-official-matches.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Activar datos oficiales en la interfaz
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<script src="match-center.js"></script>'
          addition=marker+'\n<script src="official-match-client.js"></script>'
          if 'official-match-client.js' not in s:
              s=s.replace(marker,addition)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "LALIGA TOTAL Bot"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/wire-official-matches.yml
          git add index.html .github/workflows/wire-official-matches.yml
          git commit -m "Activar postpartidos oficiales de LALIGA"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
