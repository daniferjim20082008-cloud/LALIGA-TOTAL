name: Completar aliases del Espanyol

on:
  push:
    paths:
      - ".github/workflows/add-espanyol-aliases.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Añadir nombres específicos del Espanyol
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
            'match-center.js': [
              ('ESP:["espanyol","rcd espanyol","espanyol barcelona"]', 'ESP:["espanyol","rcd espanyol","espanyol barcelona","rcd espanyol de barcelona"]')
            ],
            'client-rosters.js': [
              ('ESP:["espanyol","rcd espanyol","espanyol barcelona"]', 'ESP:["espanyol","rcd espanyol","espanyol barcelona","rcd espanyol de barcelona"]')
            ],
            'match-sofa-fallback.js': [
              ('ESP:["espanyol","rcd espanyol"]', 'ESP:["espanyol","rcd espanyol","espanyol barcelona","rcd espanyol de barcelona"]')
            ],
            'scripts/update_laliga_espn.py': [
              ('"ESP": ["espanyol", "rcd espanyol", "espanyol barcelona"]', '"ESP": ["espanyol", "rcd espanyol", "espanyol barcelona", "rcd espanyol de barcelona"]')
            ],
            'scripts/update_laliga_total.py': [
              ('"ESP": ["espanyol", "rcd espanyol"]', '"ESP": ["espanyol", "rcd espanyol", "espanyol barcelona", "rcd espanyol de barcelona"]')
            ]
          }

          for name, reps in replacements.items():
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              changed=False
              for old,new in reps:
                  if old in s:
                      s=s.replace(old,new,1)
                      changed=True
                  elif new in s:
                      changed=True
                  else:
                      raise SystemExit(f'No se encontró alias esperado en {name}')
              if changed:
                  p.write_text(s,encoding='utf-8')
          PY

          git config user.name "LALIGA TOTAL Bot"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/add-espanyol-aliases.yml
          git add match-center.js client-rosters.js match-sofa-fallback.js scripts/update_laliga_espn.py scripts/update_laliga_total.py .github/workflows/add-espanyol-aliases.yml
          git commit -m "Reconocer Espanyol Barcelona en todos los proveedores"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
